name: NPM Security Scan

# Workflow réutilisable de scan sécurité :
#   - Trivy    : vulnérabilités des dépendances (lit le lockfile, aucune installation)
#   - Gitleaks : secrets dans l'historique git
# 2 jobs parallèles et indépendants.
#
# Malgré son nom historique, ce workflow n'a plus rien de spécifique à Node :
# Trivy détecte package-lock.json, composer.lock, go.sum, requirements.txt, etc.
#
# v1.2.1 — le job `npm audit` a été retiré. L'endpoint d'audit du registry npm
# (registry.npmjs.org/-/npm/v1/security/advisories/bulk) ne répondait pas depuis
# les runners GitHub (step tué au timeout de 6 min sur tous les runs observés), et Trivy couvre
# les mêmes avis (source : GitHub Advisory Database) sans dépendance réseau à npm.
# Les inputs `node-version`, `audit-level`, `audit-omit-dev` et `enable-npm-audit`
# sont conservés pour ne pas casser les callers existants mais sont IGNORÉS.
# Ils seront retirés en v2.0.0.
#
#   jobs:
#     security:
#       uses: Skuskusku13/workflows-reusable/.github/workflows/npm-security.yml@v1.2.1
#       with:
#         project-name: portfolio

on:
  workflow_call:
    inputs:
      project-name:
        description: "Nom du projet appelant (affichage uniquement)"
        default: 'project'
        required: false
        type: string
      working-directory:
        description: "Chemin vers la racine du projet à scanner (là où se trouve le lockfile)"
        default: '.'
        required: false
        type: string

      # --- Trivy ---
      enable-trivy:
        default: true
        required: false
        type: boolean
      trivy-severity:
        description: "Sévérités Trivy déclenchant un échec (séparées par des virgules)"
        default: 'CRITICAL,HIGH'
        required: false
        type: string
      trivy-scanners:
        description: "Scanners Trivy (séparés par des virgules) : vuln, misconfig, license. `misconfig` analyse aussi Dockerfile / compose / K8s."
        default: 'vuln'
        required: false
        type: string

      # --- Gitleaks ---
      enable-gitleaks:
        default: true
        required: false
        type: boolean

      # --- DÉPRÉCIÉS : ignorés depuis v1.2.1, retirés en v2.0.0 ---
      node-version:
        description: "DÉPRÉCIÉ, ignoré (npm audit retiré en v1.2.1)"
        default: ''
        required: false
        type: string
      audit-level:
        description: "DÉPRÉCIÉ, ignoré (npm audit retiré en v1.2.1)"
        default: ''
        required: false
        type: string
      audit-omit-dev:
        description: "DÉPRÉCIÉ, ignoré (npm audit retiré en v1.2.1)"
        default: true
        required: false
        type: boolean
      enable-npm-audit:
        description: "DÉPRÉCIÉ, ignoré (npm audit retiré en v1.2.1)"
        default: false
        required: false
        type: boolean

jobs:
  trivy:
    name: "Trivy (${{ inputs.project-name }})"
    if: ${{ inputs.enable-trivy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Par défaut scanners=vuln uniquement (les secrets sont couverts par Gitleaks).
      # Mirrors ECR en priorité : la DB sur ghcr.io est régulièrement rate-limitée.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          scanners: ${{ inputs.trivy-scanners }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          ignore-unfixed: true
          cache: 'true'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db

  gitleaks:
    name: "Gitleaks (${{ inputs.project-name }})"
    if: ${{ inputs.enable-gitleaks }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
