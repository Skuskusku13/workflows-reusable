name: OWASP ZAP Full Scan

# Workflow réutilisable de scan DAST COMPLET via OWASP ZAP : spider + analyse
# passive + SCAN ACTIF. ZAP envoie de vraies attaques (injections SQL, XSS,
# traversée de chemin, ...) sur chaque point d'entrée découvert.
#
# Conséquences :
#   - Long (dizaines de minutes) et bruyant : à planifier (schedule), pas à lancer
#     sur chaque pull request. Utiliser owasp-zap-baseline.yml pour les PR.
#   - À ne lancer QUE sur des cibles dont vous êtes propriétaire. Le mode par
#     défaut (app démarrée dans le runner) est sans risque pour l'extérieur.
#
# Agnostique du langage, mêmes inputs que owasp-zap-baseline.yml. Deux modes :
#   1. App locale : l'app est installée / buildée / démarrée dans le runner via les
#      commandes fournies (npm, php -S, docker compose, ...), puis ZAP scanne
#      http://localhost:<port>.
#   2. Cible distante : `target-url` est renseigné, les étapes install / build /
#      start sont ignorées et ZAP scanne directement l'URL.
#
# Le rapport (HTML / JSON / Markdown) est publié en artifact GitHub Actions.
#
# Exemple — SPA Node, tous les lundis :
#   on:
#     schedule:
#       - cron: '0 8 * * 1'
#     workflow_dispatch:
#   jobs:
#     zap-full-scan:
#       uses: Skuskusku13/workflows-reusable/.github/workflows/owasp-zap-full-scan.yml@v1.2.1
#       with:
#         project-name: portfolio
#         node-version: '22'
#         install-command: npm ci --no-audit --no-fund
#         build-command: npm run build
#         start-command: npm run preview -- --port 4173 --host
#         port: '4173'
#         zap-ajax-spider: true
#         zap-active-scan-minutes: '30'
#
# Exemple — backend conteneurisé avec API authentifiée :
#   jobs:
#     zap-full-scan:
#       uses: Skuskusku13/workflows-reusable/.github/workflows/owasp-zap-full-scan.yml@v1.2.1
#       with:
#         project-name: mon-api
#         start-command: docker compose -f .docker/docker-compose.yml up -d --build
#         stop-command: docker compose -f .docker/docker-compose.yml down -v
#         port: '8080'
#         health-check-path: /health
#         startup-timeout-seconds: '180'
#       secrets:
#         zap-auth-header-value: ${{ secrets.ZAP_AUTH_TOKEN }}   # ex : "Bearer eyJ..."

on:
  workflow_call:
    inputs:
      project-name:
        description: "Nom du projet appelant (affichage + nom de l'artifact du rapport)"
        default: 'project'
        required: false
        type: string
      working-directory:
        description: "Répertoire depuis lequel les commandes install / build / start / stop sont exécutées"
        default: '.'
        required: false
        type: string

      # --- Démarrage de l'app dans le runner (ignoré si target-url est renseigné) ---
      node-version:
        description: "Si renseigné, installe Node.js (actions/setup-node, cache npm). Laisser vide pour un projet non-Node."
        default: ''
        required: false
        type: string
      install-command:
        description: "Commande d'installation des dépendances. Vide + node-version renseigné = `npm ci --no-audit --no-fund`. Vide sinon = étape ignorée."
        default: ''
        required: false
        type: string
      build-command:
        description: "Commande de build avant démarrage (vide = pas de build)"
        default: ''
        required: false
        type: string
      start-command:
        description: "Commande qui démarre l'app en écoute sur `port` (doit écouter sur 0.0.0.0). Ex : `npm run preview -- --port 4173 --host`, `php -S 0.0.0.0:8000 -t public`, `docker compose up -d --build`. Obligatoire sauf si `target-url` est renseigné."
        default: ''
        required: false
        type: string
      stop-command:
        description: "Commande d'arrêt exécutée en fin de job (ex : `docker compose down -v`). Le processus lancé par start-command est tué dans tous les cas."
        default: ''
        required: false
        type: string
      port:
        description: "Port localhost sur lequel l'app écoute. Obligatoire sauf si `target-url` est renseigné."
        default: ''
        required: false
        type: string
      health-check-path:
        description: "Chemin testé sur http://localhost:<port> avant de lancer ZAP (doit répondre 2xx/3xx)"
        default: '/'
        required: false
        type: string
      startup-timeout-seconds:
        description: "Temps max d'attente du démarrage de l'app, en secondes"
        default: '90'
        required: false
        type: string

      # --- Cible distante (remplace le démarrage local) ---
      target-url:
        description: "URL complète à scanner à la place de l'app locale (ex : https://staging.example.com). Uniquement des cibles dont vous êtes propriétaire : ZAP envoie de vraies attaques."
        default: ''
        required: false
        type: string

      # --- ZAP ---
      zap-spider-minutes:
        description: "Durée max du spider ZAP en minutes"
        default: '5'
        required: false
        type: string
      zap-ajax-spider:
        description: "Active le spider navigateur (`-j`) en plus du spider classique. Indispensable pour une SPA dont le contenu est rendu en JavaScript. Plus lent."
        default: false
        required: false
        type: boolean
      zap-active-scan-minutes:
        description: "Durée max du scan actif en minutes (config ZAP scanner.maxScanDurationInMins). 0 = illimité, à éviter en CI."
        default: '30'
        required: false
        type: string
      zap-fail-on-warn:
        description: "Si true, le job échoue aussi sur les alertes WARN (pas seulement FAIL)"
        default: false
        required: false
        type: boolean
      zap-rules-file:
        description: "Chemin, relatif à la racine du repo, d'un fichier de règles ZAP (option -c) pour passer certaines règles en IGNORE / WARN / FAIL"
        default: ''
        required: false
        type: string
      zap-auth-header:
        description: "Nom du header d'authentification ajouté par ZAP quand le secret `zap-auth-header-value` est fourni"
        default: 'Authorization'
        required: false
        type: string
      job-timeout-minutes:
        description: "Timeout global du job en minutes. Doit couvrir démarrage de l'app + spider + scan actif."
        default: 90
        required: false
        type: number

    secrets:
      zap-auth-header-value:
        description: "Valeur du header d'authentification (ex : `Bearer eyJ...`) que ZAP ajoute à chaque requête. Vide = scan non authentifié."
        required: false

jobs:
  zap-full-scan:
    name: "OWASP ZAP full scan (${{ inputs.project-name }})"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # target-url si fourni, sinon l'app locale.
      TARGET_URL: ${{ inputs.target-url != '' && inputs.target-url || format('http://localhost:{0}', inputs.port) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs
        if: ${{ inputs.target-url == '' && (inputs.start-command == '' || inputs.port == '') }}
        run: |
          echo "::error::Renseigner soit 'target-url', soit 'start-command' ET 'port'."
          exit 1

      - name: Setup Node
        if: ${{ inputs.target-url == '' && inputs.node-version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        if: ${{ inputs.target-url == '' && inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      # node-version renseigné sans install-command → npm ci (même règle que le baseline).
      - name: Install dependencies (npm ci par défaut)
        if: ${{ inputs.target-url == '' && inputs.install-command == '' && inputs.node-version != '' }}
        run: npm ci --no-audit --no-fund

      - name: Build app
        if: ${{ inputs.target-url == '' && inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Start app in background
        if: ${{ inputs.target-url == '' }}
        run: |
          nohup ${{ inputs.start-command }} > app-server.log 2>&1 &
          echo $! > app-server.pid
          disown

      - name: Wait for app readiness
        if: ${{ inputs.target-url == '' }}
        run: |
          URL="${TARGET_URL}${{ inputs.health-check-path }}"
          MAX_ATTEMPTS=$(( ${{ inputs.startup-timeout-seconds }} / 3 ))
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if curl -sfL "$URL" > /dev/null; then
              echo "App prête après $i tentative(s) : $URL"
              exit 0
            fi
            echo "En attente de l'app ($i/$MAX_ATTEMPTS) : $URL"
            sleep 3
          done
          echo "::error::L'app n'a pas répondu en ${{ inputs.startup-timeout-seconds }}s sur $URL. Logs du serveur :"
          cat app-server.log || true
          exit 1

      # ZAP lit ZAP_AUTH_HEADER / ZAP_AUTH_HEADER_VALUE (add-on Replacer) et ajoute
      # le header à chaque requête. Variables définies uniquement si le secret est
      # fourni : une valeur vide ferait envoyer un header vide.
      - name: Configure ZAP auth header
        env:
          ZAP_AUTH_SECRET: ${{ secrets.zap-auth-header-value }}
        run: |
          if [ -n "$ZAP_AUTH_SECRET" ]; then
            echo "::add-mask::$ZAP_AUTH_SECRET"
            {
              echo "ZAP_AUTH_HEADER=${{ inputs.zap-auth-header }}"
              echo "ZAP_AUTH_HEADER_VALUE=$ZAP_AUTH_SECRET"
            } >> "$GITHUB_ENV"
            echo "Scan authentifié : header '${{ inputs.zap-auth-header }}' ajouté à chaque requête."
          else
            echo "Scan non authentifié (aucun secret zap-auth-header-value fourni)."
          fi

      # -m : durée max du spider | -z : borne le scan actif | -j : spider navigateur
      # -I : ne pas échouer sur WARN
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: ${{ inputs.zap-rules-file }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: "${{ inputs.project-name }}-zap-full-scan-report"
          cmd_options: >-
            -m ${{ inputs.zap-spider-minutes }}
            -z "-config scanner.maxScanDurationInMins=${{ inputs.zap-active-scan-minutes }}"
            ${{ inputs.zap-ajax-spider && '-j' || '' }}
            ${{ !inputs.zap-fail-on-warn && '-I' || '' }}

      - name: Stop app
        if: ${{ always() && inputs.target-url == '' }}
        run: |
          kill "$(cat app-server.pid 2>/dev/null)" 2>/dev/null || true
          ${{ inputs.stop-command }}
